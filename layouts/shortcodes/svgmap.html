{{ $id := printf "svgmap-%d" (now.UnixNano) }}
<div id="{{ $id }}-wrapper"
    style="width:100%; height:600px; overflow:hidden; position:relative; background:transparent; border-radius:8px; cursor:grab; user-select:none; -webkit-user-select:none;">
    <div id="{{ $id }}" style="position:absolute; top:0; left:0; transform-origin:0 0;"></div>
</div>
<script>
    (function () {
        var wrapper = document.getElementById("{{ $id }}-wrapper");
        var container = document.getElementById("{{ $id }}");
        var scale = 1, panX = 0, panY = 0;
        var isDragging = false, moved = 0;
        var startX, startY, startPanX, startPanY;
        var basePath = "{{ .Get "src" | relURL }}";

        function applyTransform() {
            container.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
        }

        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') || 'light';
        }

        function loadSVG(keepView) {
            var theme = currentTheme();
            var themedSrc = basePath.replace(".svg", "-" + theme + ".svg");
            fetch(themedSrc + "?v=" + Date.now())
                .then(function (r) { return r.text(); })
                .then(function (svgText) {
                    var oldScale = scale, oldPanX = panX, oldPanY = panY;
                    container.innerHTML = svgText;
                    var svgEl = container.querySelector('svg');
                    svgEl.style.display = 'block';
                    svgEl.style.userSelect = 'none';

                    var bgRect = svgEl.querySelector('rect');
                    if (bgRect) bgRect.setAttribute('fill', 'none');

                    svgEl.querySelectorAll('a').forEach(function (link) {
                        link.style.pointerEvents = 'bounding-box';
                    });
                    svgEl.querySelectorAll('text').forEach(function (t) {
                        t.style.pointerEvents = 'none';
                        t.style.userSelect = 'none';
                    });

                    if (keepView) {
                        scale = oldScale; panX = oldPanX; panY = oldPanY;
                        applyTransform();
                        return;
                    }

                    var wrapperRect = wrapper.getBoundingClientRect();
                    var vb = svgEl.viewBox && svgEl.viewBox.baseVal;
                    var svgWidth = (vb && vb.width) ? vb.width : (svgEl.clientWidth || 1000);
                    var svgHeight = (vb && vb.height) ? vb.height : (svgEl.clientHeight || 600);

                    scale = Math.min(wrapperRect.width / svgWidth, wrapperRect.height / svgHeight) * 0.95;
                    panX = (wrapperRect.width - svgWidth * scale) / 2;
                    panY = (wrapperRect.height - svgHeight * scale) / 2;
                    applyTransform();
                })
                .catch(function (err) { console.error("SVG-Map Fehler:", err); });
        }

        loadSVG(false);

        var lastTheme = currentTheme();
        var observer = new MutationObserver(function () {
            var newTheme = currentTheme();
            if (newTheme !== lastTheme) {
                lastTheme = newTheme;
                loadSVG(true);
            }
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        var DRAG_THRESHOLD = 8;

        wrapper.addEventListener('pointerdown', function (e) {
            isDragging = true; moved = 0;
            startX = e.clientX; startY = e.clientY;
            startPanX = panX; startPanY = panY;
            wrapper.style.cursor = 'grabbing';
            wrapper.setPointerCapture(e.pointerId);
        });

        wrapper.addEventListener('pointermove', function (e) {
            if (!isDragging) return;
            var dx = e.clientX - startX, dy = e.clientY - startY;
            moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
            panX = startPanX + dx;
            panY = startPanY + dy;
            applyTransform();
        });

        wrapper.addEventListener('pointerup', function (e) {
            isDragging = false;
            wrapper.style.cursor = 'grab';

            if (moved > DRAG_THRESHOLD) return;

            var stack = document.elementsFromPoint(e.clientX, e.clientY);
            var href = null;
            for (var i = 0; i < stack.length; i++) {
                var link = stack[i].closest && stack[i].closest('a');
                if (link) {
                    href = link.getAttribute('href') || link.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
                    if (href) break;
                }
            }
            if (href) {
                window.location.href = href;
            }
        });

        wrapper.addEventListener('wheel', function (e) {
            e.preventDefault();
            var rect = wrapper.getBoundingClientRect();
            var mouseX = e.clientX - rect.left;
            var mouseY = e.clientY - rect.top;
            var delta = e.deltaY < 0 ? 1.1 : 0.9;
            var newScale = Math.min(Math.max(scale * delta, 0.3), 5);
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            applyTransform();
        }, { passive: false });
    })();
</script>
