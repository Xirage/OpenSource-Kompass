[params]
homeInfoParams.Content = """
## Einleitung

Meiner Meinung nach ist das Internet, Programme und Apps aktuell ziemlich weit von dem Grundgedanke, den es früher hatte, entfernt. Einer Demokratisierung der Kommunikation. Aktuell werden die meisten Apps von großen Unternehmen mit fragwürdigen Interessen beherrscht. Open Source bietet dazu eine Gegenbewegung an. Mittlerweile gibt es auch sehr viele Programme/Apps, die sehr gut funktionieren und manchmal sogar besser sind als ihre Closed-Source-Alternativen. Ich will mit dieser Seite einen kleinen Beitrag zur Verbreitung von Open-Source-Apps leisten. Dabei ist sehr viel subjektiv, und andere finden manche Apps vielleicht weniger oder mehr nützlich. Trotzdem möchte ich hier meine subjektive Meinung darstellen und vielleicht dem ein oder anderen Inspiration zu neuen Apps geben. Sie ist offensichtlich nicht vollständig, und bei vielen Sachen kenne ich Alternativen und bessere Dinge leider nicht – deshalb seht mir das nach und schreibt mir gerne eine Mail, wenn ihr noch weitere coole Ideen habt.

## How to navigieren

Im Folgenden teile ich es in Handy und PC/Laptop auf. Das sollte so das meiste für den Otto-Normal-Verbraucher abdecken. Ich habe dann versucht, die großen/wichtigen Funktionalitäten abzudecken (Betriebssystem, Browser, Navigation, ...).

Ich habe die Apps und Programme immer in drei Kategorien eingeteilt, womit man ungefähr einschätzen kann, wie gut die App/das Programm ist. Falls eine App mal nicht Open Source ist, erwähne ich das explizit. Alle ohne Info sind Open Source:

1. Genauso gut oder besser wie Closed Source
2. Leichte Einbußen, aber immer noch auf Closed Source verzichtbar
3. Guter Anfang, aber Closed Source für einige Anwendungen unverzichtbar

Unten seht ihr auch noch einen Übersichtsbaum und die Unterteilung. Er ist zoombar und die Überkategorien kann man direkt anklicken.

## Woher kommt das Wissen

Das Interesse für Open Source (so viel wie ich mich erinnere) ist zu großen Teilen durch lesen der Biografie "Permanent Record" von Edward Snowden entstanden. Auch wo ich dann 2022 auf mein neues Handy das de-googelte und open source basierende Betriebsystem E/os installierte wurde das interesse immer größer. Seitdem versuche ich so gut es geht Open Source Apps und Programme zu nutzen und habe über die Zeit relativ viele Programme kennengelernt

## Bezahlung von Open Source
Ein wichtiges Anliegen von mir ist des weiteren die Bezahlung. Die Open Source Community könnte viel größer sein wenn die Entwickler Geld verdienen könnten. Vieles basiert schon auf Spenden. Meiner Meinung nach wäre durchaus der Markt da an Leute die OS Datenschutzsoftware bezahlen würden, oft ist aber die Friktion zu groß. Eine Idee die ich hatte wäre man kann auf einer Plattform angeben man will zb. 20€ pro Monat für seine Software ausgeben und das kann man dann prozentual aufteilen 20% geht an Linux, 20% an e/OS/ 10% an Syncthing usw.. Dadurch hätten die Entwickler Datenschutzfreundlicher Softwar ein geregeltes Einkommen. Eine Art Möglichkeit die das so anbietet gibt es zwar schon (Liberapay) da ist die Friktion aber immer noch recht groß (kleine Beträge können nicht überwiesen werden). Trotzdem ist es ein guter Anfang und sehr zu empfehlen, wenn man seine Creator unterstützen möchte. Interessant wäre eine weiterentwicklung auf andere Lebensbereiche wie Musik, Youtube oder Film. Man legt einen Monatlichen Betrag fest und teilt ihn je nach Nutzungsverhalten oder Interesse seinen Lieblingscreatorn auf (ohne closed Source Plattformen)
{{< svgmap src="images/os-kompass-map.svg" >}}

"""

